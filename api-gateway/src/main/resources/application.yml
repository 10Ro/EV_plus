server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

services:
  ingestion:
    url: ${INGESTION_SERVICE_URL:http://localhost:8081}
  processing:
    url: ${PROCESSING_SERVICE_URL:http://localhost:8082}
  mining:
    url: ${MINING_SERVICE_URL:http://localhost:8083}
  orchestrator:
    url: ${ORCHESTRATOR_SERVICE_URL:http://localhost:8084}
  results:
    url: ${RESULTS_SERVICE_URL:http://localhost:8085}
  monitoring:
    url: ${MONITORING_SERVICE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
